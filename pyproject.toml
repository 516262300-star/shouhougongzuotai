[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lds-aftersales-workbench"
version = "0.1.0"
description = "利德仕电商自动化售后工作台"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.14,<2.0",
  "fastapi>=0.115,<1.0",
  "httpx>=0.28,<1.0",
  "pydantic-settings>=2.7,<3.0",
  "Pillow>=11.0,<13.0; sys_platform == 'win32'",
  "pymysql>=1.1,<2.0",
  "sqlalchemy>=2.0,<3.0",
  "uvicorn[standard]>=0.34,<1.0",
]

[project.scripts]
pdd-check-shop = "aftersales_workbench.integrations.pdd.check_shop:main"
pdd-sync-refunds = "aftersales_workbench.integrations.pdd.sync_cli:main"
tmall-check-shops = "aftersales_workbench.integrations.tmall.check_shop:main"
tmall-sync-refunds = "aftersales_workbench.integrations.tmall.sync_cli:main"
pdd-backfill-refund-amounts = "aftersales_workbench.integrations.pdd.amount_backfill_cli:main"
aftersales-process-module3 = "aftersales_workbench.workflows.module3_cli:main"
aftersales-execute-module3-erp-refunds = "aftersales_workbench.workflows.module3_erp_refund_cli:main"
aftersales-process-module1 = "aftersales_workbench.workflows.module1_cli:main"
aftersales-preview-module1 = "aftersales_workbench.workflows.module1_preview_cli:main"
aftersales-run-module1 = "aftersales_workbench.workflows.module1_worker_cli:main"
aftersales-preview-desktop-notices = "aftersales_workbench.workflows.desktop_notice_cli:main"
aftersales-send-desktop-notices = "aftersales_workbench.workflows.desktop_sender_cli:main"
aftersales-execute-actions = "aftersales_workbench.workflows.action_cli:execute_main"
aftersales-list-actions = "aftersales_workbench.workflows.action_cli:list_main"
aftersales-confirm-action = "aftersales_workbench.workflows.action_cli:confirm_main"
aftersales-confirm-intercept = "aftersales_workbench.workflows.action_cli:intercept_main"
aftersales-check-intercept-logistics = "aftersales_workbench.workflows.module1_logistics_cli:main"
aftersales-sync-sales-owners = "aftersales_workbench.integrations.erp.sales_owner_cli:main"
aftersales-sync-erp-returns = "aftersales_workbench.integrations.erp.return_match_cli:main"
aftersales-execute-module1-erp-refunds = "aftersales_workbench.workflows.module1_erp_refund_cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-cov>=6.0,<7.0",
  "ruff>=0.9,<1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
